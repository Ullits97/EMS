<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo: installatør-hjemmeside med batteriberegner</title>
    <style>
      body {
        margin: 0;
        font-family: Georgia, serif;
        background: #f2efe9;
        color: #2b2b2b;
      }
      .site-header {
        background: #123f31;
        color: #fff;
        padding: 28px 24px;
      }
      .site-header h1 {
        margin: 0;
        font-size: 26px;
      }
      .site-header p {
        margin: 6px 0 0;
        opacity: 0.85;
      }
      main {
        max-width: 900px;
        margin: 0 auto;
        padding: 32px 16px 64px;
      }
      .prose {
        max-width: 640px;
        margin-bottom: 28px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <h1>Demo Energi ApS</h1>
      <p>Solceller · Batterier · Varmepumper — fiktiv installatørside til widget-demo</p>
    </header>
    <main>
      <div class="prose">
        <h2>Kan et hjemmebatteri betale sig for dig?</h2>
        <p>
          Prøv vores beregner. Den simulerer et helt år kvarter for kvarter med
          historiske elpriser, dit netselskabs tariffer og de danske elafgifter.
        </p>
      </div>

      <!-- Embed contract (SPEC §9): one div + one script tag. -->
      <div id="bess-calc" data-tenant="demo" data-api="http://localhost:8000"></div>
      <script src="http://localhost:8000/widget.js"></script>
    </main>
  </body>
</html>
